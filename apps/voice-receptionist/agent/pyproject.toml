[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receptionist-agent"
version = "0.1.0"
description = "Relay voice receptionist — LiveKit Agents worker"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "livekit-agents>=1.0.0",
  "livekit-plugins-deepgram>=1.0.0",
  "livekit-plugins-elevenlabs>=1.0.0",
  "livekit-plugins-openai>=1.0.0",
  "livekit-plugins-silero>=1.0.0",
  "livekit-plugins-noise-cancellation>=0.3.3,<1.0.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.6",
  "mypy>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"